name = "mvdis-watch"
main = "src/index.ts"
compatibility_date = "2025-10-01"

# 靜態儀表板。符合檔案的路徑直接由 assets 服務，其餘（/api/*、/station/:no、
# /sitemap.xml）才進 Worker。binding 讓 Worker 能把 station.html 拿來注入每站的
# 標題與 OG 標籤後再回給瀏覽器。
[assets]
directory = "./public"
binding = "ASSETS"

# 先跑 `npx wrangler d1 create mvdis`，把回傳的 database_id 填進來
[[d1_databases]]
binding = "DB"
database_name = "mvdis"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# 每分鐘一次；每次只掃一小片，見 src/scan.ts 的分層排程
[triggers]
crons = ["* * * * *"]

[observability]
enabled = true

[vars]
# 每次 cron 掃描的組合數上限（熱門層 + 冷門層 = 14）。
#
# 免費方案三個上限的實測用量（詳見 README 的「免費方案實測」）：
#   subrequest  14 / 50    只有 fetch 算，D1 查詢不算
#   D1 查詢     39 / 50    首次建表的最壞值，穩態約 7-12
#   CPU       6.45 / 10 ms 最壞值（假設 14 頁全是最重的 92KB/66 列頁），
#                          實際平均每組合只有 7.7 列，典型約 2ms
#
# CPU 是三者中餘裕最小的。若 wrangler tail 出現 CPU 超標，把這兩個數字調小
# （代價是輪完一圈變慢）；調大則相反，18/4 大約會用掉 8.3ms，已經很貼邊。
HOT_PER_TICK = "11"
COLD_PER_TICK = "3"
FETCH_CONCURRENCY = "5"
# 本機開發用的手動掃描 token。正式環境請改用
#   npx wrangler secret put SCAN_TOKEN
# 覆蓋掉它，否則 /api/scan 會變成別人拿來打監理站的跳板。
SCAN_TOKEN = "dev-only-change-me"
# 保護 /api/subscriptions 全系列端點。Discord webhook 網址等同密鑰，而這個
# 網站掛在公開網域上，沒有它任何人都能讀走你的 webhook 或亂加訂閱。
#   npx wrangler secret put ADMIN_TOKEN
ADMIN_TOKEN = "dev-only-change-me"
