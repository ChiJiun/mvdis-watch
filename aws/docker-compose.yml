# 本機開發用：Postgres 取代 RDS，LocalStack 取代 SQS／SNS／S3／Secrets Manager。
# 啟動：docker compose -f aws/docker-compose.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mvdis
      POSTGRES_PASSWORD: mvdis
      POSTGRES_DB: mvdis
    ports:
      - "5432:5432"
    volumes:
      - ./db/schema.pg.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: sqs,sns,s3,secretsmanager
      AWS_DEFAULT_REGION: us-east-1
      # 想在本機實際推到 Discord 時，啟動前設 DISCORD_WEBHOOK_URL
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    ports:
      - "4566:4566"
    volumes:
      # 啟動完成後建立 queue／topic／bucket／secret（見 aws/localstack/init/ready.d）
      - ./localstack/init/ready.d:/etc/localstack/init/ready.d:ro
